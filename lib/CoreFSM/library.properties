sentence=Framework modular de automatizacion: maquinas de estado, secuencias, imagen de proceso E/S, recetas, alarmas y comunicaciones.
paragraph=CoreFSM traslada el modelo de programacion de un automata industrial a C++ sobre microcontroladores. Ofrece bloques no bloqueantes, scan determinista PAE/OB1/PAA, tags simbolicos, temporizadores IEC 61131-3, recetas, datos persistentes, alarmas, diagnostico, expansores de E/S e imagen digital remota. El hardware puede definirse con CSV, JSON, tablas C++ manuales o un esquema Wokwi opcional.
