sentence=Framework modular de automatizacion para Arduino: maquinas de estado, secuencias por pasos, imagen de proceso E/S, recetas, DBs y alarmas.
paragraph=CoreFSM traslada el modelo de programacion de un automata industrial (PLC) a C++ sobre Arduino. Aporta bloques funcionales no bloqueantes, un ciclo de scan determinista tipo OB1, imagen de proceso de entradas y salidas (PAE/PAA) con tabla de tags simbolicos, temporizadores y contadores IEC 61131-3, handshake formal entre estaciones, bloques de datos persistentes, gestor de recetas y gestor de alarmas. Separa el tiempo productivo del tiempo de espera con los estados SUSPENDED y HELD de PackML, vigila cada paso en dos escalones (aviso y fallo) y mide el ciclo de scan. Incluye un generador que convierte el diagram.json de Wokwi en la tabla de hardware, de modo que el esquema grafico es la unica fuente de verdad.
